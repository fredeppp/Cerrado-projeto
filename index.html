<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cerrado</title>

  <!-- O elemento de áudio no HTML -->
  <audio id="meu-player" controls></audio>
  
  <script>
    // Variável global para controlar o áudio atual e poder pará-lo
    let audioAtual = null;

    function parar_audio() {
      if (audioAtual) {
        audioAtual.pause();
        audioAtual.currentTime = 0;
        audioAtual = null;
      }
    }

    function tocar_audio(nome, pastaOuDublador) {
      // Para qualquer áudio que esteja tocando antes de iniciar o próximo
      parar_audio();

      if (!pastaOuDublador) {
        audioAtual = new Audio(`audio/${nome}.mp3`);
        audioAtual.play().catch(erro => {
          console.log("Erro ao tocar o áudio da raiz:", erro);
        });
        return;
      }

      // Gera variações de nomes de pastas para evitar erros de maiúsculas/minúsculas
      const p = pastaOuDublador;
      const pTitle = p.charAt(0).toUpperCase() + p.slice(1).toLowerCase();
      const pLower = p.toLowerCase();
      const pUpper = p.toUpperCase();
      const pastasCandidatas = Array.from(new Set([pTitle, pLower, pUpper, p]));

      let index = 0;

      function tentarTocar() {
        if (index >= pastasCandidatas.length) return;

        const pastaAtual = pastasCandidatas[index];
        const caminho = `audio/${pastaAtual}/${nome}.mp3`;

        audioAtual = new Audio(caminho);

        audioAtual.play().catch(erro => {
          console.log(`Tentativa de áudio falhou para (${caminho}):`, erro);
          index++;
          tentarTocar();
        });
      }

      tentarTocar();
    }
  </script>

  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

    const shuffleArray = (array) => {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    };

    // Componente Mascote Lobo-Guará
    const LoboGuaraMascot = ({ expression = 'neutral', isSpeaking = false, size = 'normal' }) => {

            <rect x="113" y="185" width="12" height="32" rx="6" fill="#2C221E" />
            <path d="M58 72 L42 12 L80 48 Z" fill="#D96B27" stroke="#8C330C" strokeWidth="3" />
            <path d="M60 67 L50 26 L74 50 Z" fill="#2C221E" />
            <path d="M142 72 L158 12 L120 48 Z" fill="#D96B27" stroke="#8C330C" strokeWidth="3" />
            <path d="M140 67 L150 26 L126 50 Z" fill="#2C221E" />
            <path d="M50 90 C50 50, 150 50, 150 90 C150 120, 130 135, 100 135 C70 135, 50 120, 50 90 Z" fill="#D96B27" stroke="#8C330C" strokeWidth="3" />
            <path d="M65 100 C65 80, 135 80, 135 100 C135 125, 120 135, 100 135 C80 135, 65 125, 65 100 Z" fill="#FDF6E2" />
            {expression === 'celebrate' || expression === 'happy' ? (
              <>
                <path d="M72 85 Q80 75 88 85" stroke="#2C221E" strokeWidth="4" strokeLinecap="round" fill="none" />

                <circle cx="80" cy="85" r="7" fill="#2C221E" />

            ) : (
              <>
                <circle cx="80" cy="85" r="7" fill="#2C221E" />
                <circle cx="120" cy="85" r="7" fill="#2C221E" />
                <circle cx="78" cy="83" r="2.5" fill="#FFFFFF" />
                <circle cx="118" cy="83" r="2.5" fill="#FFFFFF" />
              </>
            )}
            <polygon points="100,98 92,108 108,108" fill="#2C221E" />

            ) : (

    };

    // Componente de Imagem Inteligente
    const QuizImage = ({ fileName, fallbackFiles = [], altText, icon }) => {
      const [currentStep, setCurrentStep] = useState(0);
      const [hasError, setHasError] = useState(false);

      useEffect(() => {
        setCurrentStep(0);
        setHasError(false);
      }, [fileName, altText]);

      const buildCandidates = (mainFile, fallbacks = []) => {
        const list = [mainFile, ...(fallbacks || [])].filter(Boolean);
        const extra = [];

        list.forEach(f => {
          const lower = f.toLowerCase();
          const noAccents = f.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
          const noAccentsLower = lower.normalize("NFD").replace(/[\u0300-\u036f]/g, "");

          extra.push(f);
          extra.push(lower);
          extra.push(noAccents);
          extra.push(noAccentsLower);

          const dotIndex = f.lastIndexOf('.');
          const baseName = dotIndex !== -1 ? f.substring(0, dotIndex) : f;
          const baseNameLower = baseName.toLowerCase();
          const baseNameNoAccents = baseNameLower.normalize("NFD").replace(/[\u0300-\u036f]/g, "");

          ['.png', '.PNG', '.jpg', '.JPG', '.jpeg', '.JPEG'].forEach(ext => {
            extra.push(`${baseName}${ext}`);
            extra.push(`${baseNameLower}${ext}`);
            extra.push(`${baseNameNoAccents}${ext}`);
          });
        });

        return Array.from(new Set(extra));
      };

      const candidates = buildCandidates(fileName, fallbackFiles);

      const handleError = () => {
        if (currentStep < candidates.length - 1) {
          setCurrentStep(prev => prev + 1);
        } else {
          setHasError(true);
        }
      };

      if (hasError || currentStep >= candidates.length) {
        return (
          <div className="w-full h-full bg-amber-200/50 backdrop-blur-sm flex flex-col items-center justify-center p-1 text-center border border-amber-300/40">
            <span className="text-2xl">{icon}</span>
            <span className="text-[9px] font-bold text-amber-950 leading-tight truncate max-w-full">
              {altText}
            </span>
          </div>
        );
      }

      const currentPath = `imagens/${encodeURI(candidates[currentStep])}`;

      return (
        <img
          src={currentPath}
          alt={altText}
          className="w-full h-full object-cover"
          onError={handleError}
        />
      );
    };

    // Componente Principal
    function App() {
      const [screen, setScreen] = useState('WELCOME');
      const [voiceEnabled, setVoiceEnabled] = useState(true);
      const [isSpeaking, setIsSpeaking] = useState(false);
      
      const [score, setScore] = useState(window.scoreSystem ? window.scoreSystem.score : 0);
      const [highScore, setHighScore] = useState(window.scoreSystem ? window.scoreSystem.highScore : 0);

      const [poemGrade, setPoemGrade] = useState('6');
      const [quizTopic, setQuizTopic] = useState('FAUNA');
      const [questionIndex, setQuestionIndex] = useState(0);

      // Estado com as opções embaralhadas da pergunta atual
      const [currentOptions, setCurrentOptions] = useState([]);

      const [mascotExpr, setMascotExpr] = useState('neutral');
      const [selectedOption, setSelectedOption] = useState(null);
      const [answerState, setAnswerState] = useState(null);
      
      const speakText = (text) => {
        // Opcional para voz sintetizada
      };

      // Função para preparar e embaralhar as opções da pergunta
      const carregarOpcoesAleatorias = (topic, index) => {
        const questionData = QUIZ_DATA[topic]?.[index];
        if (!questionData) return;

        // Mapeia adicionando o indicador se a opção é a correta antes de embaralhar
        const optionsWithFlag = questionData.options.map((opt, idx) => ({
          ...opt,
          isCorrect: idx === questionData.correctIndex
        }));

        // Salva as opções em ordem aleatória no estado
        setCurrentOptions(shuffleArray(optionsWithFlag));
      };

      const changeScreen = (nextScreen) => {
        parar_audio();
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        setIsSpeaking(false);
        setScreen(nextScreen);

        if (nextScreen === 'WELCOME') {
          setMascotExpr('happy');
          tocar_audio("intro");
        } else if (nextScreen === 'MAP_SCREEN') {
          setMascotExpr('happy');
          tocar_audio("intro");
        } else if (nextScreen === 'THEME_SELECT') {
          setMascotExpr('happy');
          tocar_audio("intro2");
        } else if (nextScreen === 'QUIZ_TOPIC') {
          setMascotExpr('happy');
          tocar_audio("intro4");
        }
      };

      const startQuiz = (topic) => {
        setQuizTopic(topic);
        setQuestionIndex(0);
        setSelectedOption(null);
        setAnswerState(null);
        setMascotExpr('thinking');

        // Embaralha as opções da primeira pergunta
        carregarOpcoesAleatorias(topic, 0);

        setScreen('QUIZ_PLAY');

        const firstQ = QUIZ_DATA[topic][0];
        if (firstQ) {
          speakText(firstQ.question);
          const pastaTema = topic.charAt(0) + topic.slice(1).toLowerCase();
          tocar_audio("pergunta1", pastaTema);
        }
      };

      const handleCornerSelect = (index) => {
        if (answerState === 'correct') return;

        parar_audio();

        const selectedOpt = currentOptions[index];
        setSelectedOption(index);

        if (selectedOpt && selectedOpt.isCorrect) {
          const res = window.scoreSystem ? window.scoreSystem.addPoints(10) : { totalScore: score + 10 };
          setScore(res.totalScore);
          if (window.scoreSystem) setHighScore(window.scoreSystem.highScore);

          setAnswerState('correct');
          setMascotExpr('celebrate');

          let dublador = "Lilia";

          if (quizTopic === "FAUNA") {
            dublador = "Lilia";
          } else if (quizTopic === "FLORA") {
            dublador = "Laura";
          } else if (quizTopic === "SOLO") {
            dublador = "Maria";
          }

          tocar_audio("correto", dublador);
          speakText("Muito bem! Resposta correta!");

          setTimeout(() => {
            if (questionIndex + 1 < QUIZ_DATA[quizTopic].length) {
              const nextIdx = questionIndex + 1;
              setQuestionIndex(nextIdx);
              setSelectedOption(null);
              setAnswerState(null);
              setMascotExpr('thinking');
              
              // Embaralha as opções para a próxima pergunta
              carregarOpcoesAleatorias(quizTopic, nextIdx);

              speakText(QUIZ_DATA[quizTopic][nextIdx].question);
              
              let numeroDaPergunta = nextIdx + 1;
              const pastaTema = quizTopic.charAt(0) + quizTopic.slice(1).toLowerCase(); 
              
              tocar_audio("pergunta" + numeroDaPergunta, pastaTema);
            } else {
              if (window.scoreSystem) window.scoreSystem.playFanfare();
              setScreen('QUIZ_RESULTS');
              setMascotExpr('celebrate');
              tocar_audio("final", dublador);
              speakText("Sensacional! Concluiu o Quiz com sucesso!");
            }
          }, 3000);
        } else {
            const pontosADescontar = 10;
            const novoValor = Math.max(0, score - pontosADescontar);
  
            if (window.scoreSystem && typeof window.scoreSystem.removePoints === 'function') {
              window.scoreSystem.removePoints(pontosADescontar);
            } else if (window.scoreSystem) {
              window.scoreSystem.score = novoValor;
            }
  
            setScore(novoValor);

            setAnswerState('wrong');
            setMascotExpr('thinking');
            let dublador = "Lilia";

            if (quizTopic === "FAUNA") {
              dublador = "Lilia";
            } else if (quizTopic === "FLORA") {
              dublador = "Laura";
            } else if (quizTopic === "SOLO") {
              dublador = "Maria";
            }

            tocar_audio("incorreto", dublador);
            speakText("Ops, resposta incorreta. Tente outra vez!");
        }
      };

      const cornerLabelsDefault = ["Canto Sup. Esq.", "Canto Sup. Dir.", "Canto Inf. Esq.", "Canto Inf. Dir."];

      return (
        <div className="min-h-screen text-slate-800 flex flex-col justify-between p-4 relative z-10">
          {/* BARRA SUPERIOR */}
          <header className="max-w-4xl mx-auto w-full flex justify-between items-center bg-white/40 backdrop-blur-md p-3 rounded-2xl shadow-lg border border-white/50 mb-4">

                className="bg-white/50 hover:bg-white/90 font-black px-7 py-6 backdrop-blur-sm p-2 rounded-full shadow-sm border border-white/50"
              >
                🏠
              </button>
              <button 
                onClick={() => location.reload()}
                className="bg-white/50 hover:bg-white/90 font-black px-7 py-6 backdrop-blur-sm p-2 rounded-full shadow-sm border border-white/50"
              >
                🔄️
              </button>
              <button 
                  onClick={() => window.location.href = "creditos.html"}
                  className="bg-white/50 hover:bg-white/90 font-black px-3 py-3 backdrop-blur-sm p-2 rounded-full shadow-sm border border-white/50 text-amber-20"
              >
                  📜 Créditos
              </button>
            </div>
          </header>

          {/* CONTEÚDO PRINCIPAL */}
          <main className="max-w-4xl mx-auto w-full flex-grow flex items-center justify-center">
            
            {/* TELA DE BOAS-VINDAS */}
            {screen === 'WELCOME' && (
              <div className="bg-white/40 backdrop-blur-lg p-8 rounded-3xl shadow-2xl border border-white/60 text-center w-full flex flex-col items-center">
                <h1 className="text-3xl sm:text-5xl font-black text-orange-800 mb-3 drop-shadow">
                  Tesouros do Cerrado
                </h1>
                <LoboGuaraMascot expression={mascotExpr} isSpeaking={isSpeaking} size="large" />

                <button
                  onClick={() => changeScreen('THEME_SELECT')}
                  className="px-8 py-4 bg-orange-600/90 hover:bg-orange-600 text-white text-2xl font-black rounded-2xl shadow-xl transition transform active:scale-95 backdrop-blur-sm border border-orange-400/50"
                >
                  INICIAR AVENTURA
                </button>
              </div>
            )}

            {/* SELEÇÃO DO QUE FAZER */}
            {screen === 'THEME_SELECT' && (
              <div className="bg-white/40 backdrop-blur-lg p-6 rounded-3xl shadow-2xl border border-white/60 text-center w-full flex flex-col items-center">
                <LoboGuaraMascot expression="happy" isSpeaking={isSpeaking} size="normal" />
                
                <h2 className="text-2xl font-black text-amber-950 my-3 drop-shadow-sm">
                  O Cerrado Mineiro é cheio de Tesouros. Que tal descobrimos alguns deles?
                </h2>
                <div className="grid grid-cols-1 sm:grid-cols-1 gap-4 w-full max-w-lg mt-2">
                  <button
                    onClick={() => changeScreen('QUIZ_TOPIC')}
                    className="p-6 bg-orange-600/90 hover:bg-orange-600 backdrop-blur-sm border border-orange-400/50 text-white rounded-2xl font-black text-xl shadow-lg flex flex-col items-center justify-center space-y-2 transition transform active:scale-95"
                  >
                    <span>SIM</span>
                  </button>
                </div>
              </div>
            )}

            {/* SELEÇÃO DO TEMA DO QUIZ */}
            {screen === 'QUIZ_TOPIC' && (
              <div className="bg-white/40 backdrop-blur-lg p-6 rounded-3xl shadow-2xl border border-white/60 text-center w-full">
                <h2 className="text-2xl font-black text-amber-950 mb-6 drop-shadow-sm">Por onde começa sua aventura?</h2>
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                  <button
                    onClick={() => startQuiz('FAUNA')}
                    className="p-6 bg-orange-500/90 hover:bg-orange-500 backdrop-blur-sm border border-orange-300/50 text-white rounded-2xl font-black text-lg shadow-lg flex flex-col items-center justify-center space-y-2 transition transform active:scale-95"
                  >
                    <span>FAUNA</span>
                  </button>
                  <button
                    onClick={() => startQuiz('FLORA')}
                    className="p-6 bg-emerald-600/90 hover:bg-emerald-600 backdrop-blur-sm border border-emerald-400/50 text-white rounded-2xl font-black text-lg shadow-lg flex flex-col items-center justify-center space-y-2 transition transform active:scale-95"
                  >
                    <span>FLORA</span>
                  </button>
                  <button
                    onClick={() => startQuiz('SOLO')}
                    className="p-6 bg-amber-800/90 hover:bg-amber-800 backdrop-blur-sm border border-amber-600/50 text-white rounded-2xl font-black text-lg shadow-lg flex flex-col items-center justify-center space-y-2 transition transform active:scale-95"
                  >
                    <span>SOLO E ÁGUAS</span>
                  </button>
                </div>
              </div>
            )}

            {/* TELA DE JOGO DO QUIZ */}
            {screen === 'QUIZ_PLAY' && (
              <div className="bg-white/40 backdrop-blur-lg p-6 rounded-3xl shadow-2xl border border-white/60 w-full flex flex-col justify-between min-h-[520px]">
                <div className="flex justify-between items-center font-black text-sm text-amber-950 border-b border-amber-950/20 pb-2">
                  <span>ÁREA: {quizTopic}</span>
                  <span>Pergunta {questionIndex + 1} de {QUIZ_DATA[quizTopic].length}</span>
                </div>

                <div className="my-3 text-center flex flex-col items-center">
                  <LoboGuaraMascot expression={mascotExpr} isSpeaking={isSpeaking} size="small" />
                  <div className="bg-white/50 backdrop-blur-sm border border-white/60 p-4 rounded-2xl my-2 font-black text-base sm:text-lg text-slate-800 w-full shadow-sm">
                    {QUIZ_DATA[quizTopic][questionIndex].question}
                  </div>
                </div>

                {/* GRELHA DOS 4 CANTOS (OPÇÕES EMBARALHADAS) */}
                <div className="grid grid-cols-2 gap-4 w-full">
                  {currentOptions.map((opt, idx) => {
                    const isSelected = selectedOption === idx;
                    let borderStyle = "border border-white/60 bg-white/40 hover:bg-white/60 backdrop-blur-sm";

                    if (isSelected && answerState === 'correct') {
                      borderStyle = "border-4 border-emerald-500 bg-emerald-100/80 backdrop-blur-md";
                    } else if (isSelected && answerState === 'wrong') {
                      borderStyle = "border-4 border-red-500 bg-red-100/80 backdrop-blur-md";
                    }

                    return (
                      <button
                        key={`${quizTopic}_q${questionIndex}_opt${idx}`}
                        onClick={() => handleCornerSelect(idx)}
                        className={`p-3 rounded-2xl shadow-md transition flex items-center space-x-3 text-left ${borderStyle}`}
                      >
                        <div className="w-16 h-16 sm:w-20 sm:h-20 rounded-xl overflow-hidden bg-amber-100/50 flex-shrink-0 relative border border-white/40 shadow-inner">
                          <QuizImage 
                            fileName={opt.file} 
                            fallbackFiles={opt.fallbackFiles}
                            altText={opt.title} 
                            icon={opt.icon} 
                          />
                        </div>
                        <div className="flex-grow min-w-0">
                          <span className="block text-[10px] font-black text-amber-900 uppercase opacity-80">
                            {opt.cornerLabel || cornerLabelsDefault[idx]}
                          </span>
                          <span className="font-black text-slate-800 text-sm sm:text-base leading-tight block truncate">
                            {opt.title}
                          </span>
                        </div>
                      </button>
                    );
                  })}
                </div>
              </div>
            )}

            {/* TELA DE RESULTADOS */}
            {screen === 'QUIZ_RESULTS' && (
              <div className="bg-white/40 backdrop-blur-lg p-8 rounded-3xl shadow-2xl border border-white/60 text-center w-full flex flex-col items-center">
                <span className="text-6xl mb-2">🎉</span>
                <h2 className="text-3xl font-black text-orange-800 drop-shadow">Parabéns!</h2>
                <LoboGuaraMascot expression="celebrate" isSpeaking={isSpeaking} size="normal" />
                <p className="text-xl font-bold my-2 text-slate-800">Obrigado por Jogar e Aprender com a gente!</p>
                <p className="text-lg font-black text-amber-950 mb-4 bg-amber-300/50 px-4 py-1 rounded-full border border-amber-400/40">
                  Pontuação Total: {score} pontos
                </p>
                <button
                  onClick={() => changeScreen('QUIZ_TOPIC')}
                  className="px-8 py-3 bg-orange-600/90 hover:bg-orange-600 text-white font-black rounded-xl shadow-lg text-lg backdrop-blur-sm border border-orange-400/50"
                >
                  Jogar Novamente
                </button>
              </div>
            )}

          </main>

          <footer className="text-center text-xs font-bold text-amber-950/80 my-4 bg-white/20 backdrop-blur-sm py-1 px-4 rounded-full max-w-fit mx-auto border border-white/30">
            Cerrado Mineiro • Projeto Educativo E.E.A.A - 2026
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
